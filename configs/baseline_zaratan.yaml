# Full-size baseline for a Zaratan GPU node (all selected VMs, PatchTST paper-sized model).
seed: 612
out_dir: outputs/baseline_zaratan
data:
  path: data/azure2019_cpu_2000vm.npz
  vm_limit: 0
  channels: [avg_cpu]
  target: avg_cpu
  seq_len: 576            # 2 days
  pred_len: 12
  quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
  train_days: 18
  val_days: 3
  train_stride: 1
  eval_stride: 12
model:
  patch_len: 16
  stride: 8
  n_layers: 3
  d_model: 128
  n_heads: 16
  d_ff: 256
  dropout: 0.2
  fc_dropout: 0.2
  head_dropout: 0.0
train:
  epochs: 30
  batch_size: 512
  windows_per_epoch: 1000000
  lr: 0.0005
  weight_decay: 0.0001
  patience: 5
  num_workers: 4
